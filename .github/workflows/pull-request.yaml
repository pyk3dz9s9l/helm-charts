name: Pull Request
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.list-changed.outputs.changed }}
      changedCharts: ${{ steps.list-changed.outputs.changedCharts }}
    steps:
    - name: Setup Helm
      uses: Azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
    - name: Checkout pull request branch
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.head_ref }}
        repository: ${{github.event.pull_request.head.repo.full_name}}
        fetch-depth: 0
    - name: Fetch upstream main branch
      run: |
        # Fetch the base repository's target branch and update origin/main to point to it
        git remote set-url origin https://github.com/CloudPirates-io/helm-charts.git
        git fetch origin ${{ github.event.repository.default_branch }}
        # Re-add the fork as a remote and checkout the PR branch
        git remote add fork https://github.com/${{ github.event.pull_request.head.repo.full_name }}.git || true
        git fetch fork ${{ github.head_ref }}
    - name: Set up chart-testing-action
      uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: lint-test before ct list-changed (gate producer)"
        printf 'branch=%s\n' "$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo 'unknown')"
        printf 'origin/main=%s\n' "$(git rev-parse --short origin/main 2>/dev/null || echo 'missing')"
        printf 'charts_dir=%s\n' "$(ls -d charts 2>/dev/null || echo 'missing')"
        printf 'changed_chart_dirs=%s\n' "$(ls charts 2>/dev/null | tr '\n' ' ' || echo 'none')"
      continue-on-error: true
    - name: Get changed charts
      id: list-changed
      run: |
        changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
        if [[ -n "$changed" ]]; then
          echo "Changed charts:"
          echo "$changed"
          echo "changed=true" >> $GITHUB_OUTPUT
          echo 'changedCharts<<EOF' >> $GITHUB_OUTPUT
          echo $changed >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT
        else
          echo "No chart changes detected"
        fi
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    needs:
    - lint-test
    if: needs.lint-test.outputs.changed == 'true'
    steps:
    - name: Checkout pull request branch
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.head_ref }}
        repository: ${{github.event.pull_request.head.repo.full_name}}
        fetch-depth: 0
    - name: Setup Helm
      uses: Azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
    - name: Setup kubectl
      uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede
    - name: Login to Docker Hub to avoid rate limits
      uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
      with:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    - name: Create kind cluster
      uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc
      with:
        cluster_name: helm-chart-test
        wait: 300s
    - name: Installing plugin helm-unittest
      run: |
        if ! helm plugin list | grep -q unittest; then
          helm plugin install https://github.com/helm-unittest/helm-unittest
        else
          echo "helm-unittest plugin already installed"
        fi
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: integration-test before sink (Run integration tests)"
        printf 'GITHUB_HEAD_REF=%s\n' "${GITHUB_HEAD_REF:-<unset>}"
        printf 'changed_output=%s\n' "${CHANGED_CHARTS:-<unset-at-job-level>}"
        if [ -f ./test-charts.sh ]; then
          echo 'test-charts.sh: present (attacker-controlled tree)'
          ls -l ./test-charts.sh 2>/dev/null || true
        else
          echo 'test-charts.sh: MISSING'
        fi
        if [ -f "$HOME/.docker/config.json" ]; then
          echo '~/.docker/config.json: present'
          grep -c 'auths' "$HOME/.docker/config.json" 2>/dev/null || true
        else
          echo '~/.docker/config.json: missing'
        fi
      continue-on-error: true
    - name: Run integration tests
      env:
        CHANGED_CHARTS: ${{ needs.lint-test.outputs.changedCharts }}
      run: |
        # Make script executable
        chmod +x ./test-charts.sh

        # Test each changed chart
        for chart_directory in ${CHANGED_CHARTS}; do
          CHART_NAME=${chart_directory#charts/}
          echo "Testing chart: $CHART_NAME"

          # Check if integration test is disabled for this chart
          if [ -f "${chart_directory}/.disable-unittest" ]; then
            echo "⏩ Skipping integration test for $CHART_NAME (.disable-unittest found)"
            continue
          fi

          # Run test script without cluster creation (kind-action already created it)
          # and without cleanup (let GitHub Actions handle it)
          ./test-charts.sh "$CHART_NAME" --no-cleanup
        done
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - opened
    - reopened
    - synchronize
    branches:
    - main
